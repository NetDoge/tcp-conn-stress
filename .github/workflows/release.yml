name: release

# 云编译并在 Releases 发布:
#   1) 推 tag 触发:  git push origin v1.0.0
#   2) 手动触发:     Actions 页面 -> release -> Run workflow,填版本号
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(tag),如 v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # 服务端依赖 epoll,只发 Linux;客户端全平台
          - { name: linux-amd64,   goos: linux,   goarch: amd64, cc: gcc,                   apt: '',                     server: true }
          - { name: linux-arm64,   goos: linux,   goarch: arm64, cc: aarch64-linux-gnu-gcc, apt: gcc-aarch64-linux-gnu,  server: true }
          - { name: darwin-amd64,  goos: darwin,  goarch: amd64, server: false }
          - { name: darwin-arm64,  goos: darwin,  goarch: arm64, server: false }
          - { name: windows-amd64, goos: windows, goarch: amd64, server: false }
    steps:
      - uses: actions/checkout@v7

      - name: 安装交叉 C 编译器
        if: matrix.apt != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.apt }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: false

      - name: 编译服务端 (C, 静态)
        if: matrix.server
        run: |
          make CC='${{ matrix.cc }}' \
               CFLAGS='-O2 -s -Wall -Wextra -pthread' \
               LDFLAGS='-pthread -static'

      - name: 编译客户端 (Go)
        run: |
          ext=''
          if [ '${{ matrix.goos }}' = 'windows' ]; then ext='.exe'; fi
          CGO_ENABLED=0 GOOS='${{ matrix.goos }}' GOARCH='${{ matrix.goarch }}' \
            go build -trimpath -ldflags '-s -w' -o "client${ext}" .

      - name: 校验产物架构
        run: |
          ls -lh
          if [ '${{ matrix.goos }}' = 'linux' ]; then
            readelf -h server client | grep -E 'Class|Machine'
          else
            # 注意用 file -b:不带文件名前缀的输出不会被 GitHub 误当注解
            for f in client client.exe; do
              [ -f "$f" ] && file -b "$f"
            done
            true
          fi

      - name: 打包
        run: |
          mkdir -p out
          V='${{ matrix.name }}'
          if [ -f server ]; then
            tar -czf "out/tcp-conn-stress-${V}.tar.gz" server client README.md
          elif [ -f client.exe ]; then
            zip -q "out/tcp-conn-stress-${V}.zip" client.exe README.md
          else
            tar -czf "out/tcp-conn-stress-${V}.tar.gz" client README.md
          fi
          ls -lh out

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: false

      - name: 编译
        run: |
          make CFLAGS='-O2 -s -Wall -Wextra -pthread' LDFLAGS='-pthread -static'
          CGO_ENABLED=0 go build -o client .

      - name: 参数校验
        run: |
          ./client -servers 127.0.0.1:1 -rate 50001 2>&1 | grep -q 'rate too large'
          ./client -servers 127.0.0.1:1 -keepalive -1s 2>&1 | grep -q 'keepalive must be'

      # 135s:故意跨过旧版 120s 读超时 bug 的阈值。
      # 旧版会在此时限内把健康连接全杀一轮(try 远超 target),
      # 这类"长跑才炸"的回归短冒烟测不出来,必须有长测兜底。
      - name: 回环长测(135s,防误杀重拨回归)
        run: |
          ./server 18888 18889 > s.log 2>&1 &
          echo $! > srv.pid
          sleep 0.5
          ./client -servers "127.0.0.1:18888,127.0.0.1:18889"                    -target 100 -rate 100 > c.log 2>&1 &
          echo $! > cli.pid
          sleep 135
          kill -INT "$(cat cli.pid)"
          sleep 3
          echo '--- client log tail ---'; tail -5 c.log
          max_try=$(grep -oE 'try=[0-9]+' c.log | cut -d= -f2 | sort -n | tail -1)
          max_alive=$(grep -oE 'alive=[0-9]+' c.log | cut -d= -f2 | sort -n | tail -1)
          closed=$(grep -oE 'closed=[0-9]+' c.log | cut -d= -f2 | sort -n | tail -1)
          [ "$max_try" = "100" ]  || { echo "FAIL: try=$max_try != 100 (健康连接被误杀重拨)"; exit 1; }
          [ "$max_alive" = "100" ] || { echo "FAIL: alive=$max_alive != 100"; exit 1; }
          [ "$closed" = "0" ]     || { echo "FAIL: closed=$closed != 0"; exit 1; }
          grep -q 'final: try=100 ok=100 closed=0' c.log || { echo "FAIL: final 行异常"; exit 1; }
          kill -INT "$(cat srv.pid)"; sleep 1

      - name: 服务端回收测试(kill -9 客户端)
        run: |
          ./server 18888 18889 > s2.log 2>&1 &
          echo $! > srv2.pid
          sleep 0.5
          ./client -servers "127.0.0.1:18888,127.0.0.1:18889"                    -target 50 -rate 50 > c2.log 2>&1 &
          CLI2=$!
          sleep 4
          kill -9 $CLI2
          sleep 3
          tail -3 s2.log
          grep -q 'alive=0 |' s2.log      || { echo "FAIL: 服务端未感知断连"; exit 1; }
          grep -q 'total_close=50' s2.log || { echo "FAIL: total_close != 50"; exit 1; }
          kill -INT "$(cat srv2.pid)"
          echo 'SMOKE PASS'

  release:
    needs: [build, smoke]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 生成 SHA256SUMS
        run: |
          cd dist
          ls -lh
          sha256sum tcp-conn-stress-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
