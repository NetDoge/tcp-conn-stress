name: release

# 云编译并在 Releases 发布:
#   1) 推 tag 触发:  git push origin v1.0.6
#   2) 手动触发:     Actions 页面 -> release -> Run workflow,填版本号
#
# 单一二进制 tcp-stress(-s 服务端 / -c 客户端),全平台全功能:
#   - Linux(amd64/arm64): cgo 静态构建,C 服务端(epoll)编入,不挑 glibc
#   - 其他平台 + linux/armv7l: 纯 Go 服务端(server_go.go),行为与 C 版对齐
# v1.0.6:-pass 鉴权、零参数 TUI、linux-armv7l 产物
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(tag),如 v1.0.1'
        required: true
        default: 'v1.0.6'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64,   goos: linux,   goarch: amd64 }
          - { name: linux-arm64,   goos: linux,   goarch: arm64, cc: aarch64-linux-gnu-gcc, apt: gcc-aarch64-linux-gnu }
          - { name: linux-armv7l,  goos: linux,   goarch: arm, goarm: '7' }
          - { name: darwin-amd64,  goos: darwin,  goarch: amd64 }
          - { name: darwin-arm64,  goos: darwin,  goarch: arm64 }
          - { name: windows-amd64, goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - name: 安装交叉 C 编译器
        if: matrix.apt != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.apt }}

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: false

      - name: 编译
        run: |
          ext=''
          if [ '${{ matrix.goos }}' = 'windows' ]; then ext='.exe'; fi
          # 版本号:tag 触发取 tag 名,手动触发取输入
          V='${{ github.event.inputs.version || github.ref_name }}'
          echo "building version: ${V}"
          if [ '${{ matrix.goos }}' = 'linux' ] && [ '${{ matrix.goarch }}' != 'arm' ]; then
            # cgo 静态构建:C 服务端经 server_linux.go 编入,交叉时 CC 指向交叉工具链
            CGO_ENABLED=1 CC='${{ matrix.cc || 'gcc' }}' GOARCH='${{ matrix.goarch }}' \
              go build -trimpath -tags 'osusergo netgo' \
              -ldflags "-s -w -extldflags -static -X main.version=${V}" -o "tcp-stress${ext}" .
          else
            # darwin/windows/linux-armv7l:纯 Go 服务端(server_go.go),全功能
            GOARM_FLAG=''
            if [ '${{ matrix.goarch }}' = 'arm' ]; then GOARM_FLAG='GOARM=7'; fi
            env CGO_ENABLED=0 GOOS='${{ matrix.goos }}' GOARCH='${{ matrix.goarch }}' $GOARM_FLAG \
              go build -trimpath -ldflags "-s -w -X main.version=${V}" -o "tcp-stress${ext}" .
          fi

      - name: 校验产物
        run: |
          ls -lh
          if [ '${{ matrix.goos }}' = 'linux' ]; then
            readelf -h tcp-stress | grep -E 'Class|Machine'
            if [ '${{ matrix.goarch }}' = 'amd64' ]; then ./tcp-stress -v; fi
            if [ '${{ matrix.goarch }}' = 'arm' ]; then
              readelf -h tcp-stress | grep -q 'Machine:.*ARM' || { echo 'FAIL: not ARM'; exit 1; }
              readelf -h tcp-stress | grep -q 'Class:.*ELF32' || { echo 'FAIL: not ELF32'; exit 1; }
            fi
          else
            # file -b:输出不带文件名前缀,不会被 GitHub 误当注解
            for f in tcp-stress tcp-stress.exe; do
              [ -f "$f" ] && file -b "$f"
            done
            true
          fi

      - name: 打包
        run: |
          mkdir -p out
          V='${{ matrix.name }}'
          if [ -f tcp-stress.exe ]; then
            zip -q "out/tcp-conn-stress-${V}.zip" tcp-stress.exe README.md
          else
            tar -czf "out/tcp-conn-stress-${V}.tar.gz" tcp-stress README.md
          fi
          ls -lh out

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: false

      - name: 编译(与发布同款静态 cgo 构建)
        run: make VERSION=ci-smoke

      - name: 参数校验
        run: |
          ./tcp-stress -c -servers 127.0.0.1:1 -rate 50001 2>&1 | grep -q 'rate too large'
          ./tcp-stress -c -servers 127.0.0.1:1 -keepalive -1s 2>&1 | grep -q 'keepalive must be'
          ./tcp-stress -s 99999 2>&1 | grep -q 'invalid port'
          ./tcp-stress -s 2>&1 | grep -q '至少一个端口'
          ./tcp-stress 8888 -c 2>&1 | grep -q '未指定模式'
          ./tcp-stress -c -servers 127.0.0.1:1 -target 9223372036854775808 2>&1 | grep -q 'target too large'
          ./tcp-stress -v    | grep -q '^tcp-stress ci-smoke (linux/amd64)'
          ./tcp-stress --version | grep -q 'ci-smoke'
          ./tcp-stress -h    | grep -q '家用宽带'
          ./tcp-stress -h; [ $? -eq 0 ] || { echo 'FAIL: -h 应 exit 0'; exit 1; }
          ./tcp-stress --help | grep -q '客户端模式'

      # 135s:故意跨过旧版 120s 读超时 bug 的阈值。
      # 旧版会在此时限内把健康连接全杀一轮(try 远超 target),
      # 这类"长跑才炸"的回归短冒烟测不出来,必须有长测兜底。
      - name: 回环长测(135s,防误杀重拨回归)
        run: |
          ./tcp-stress -s 18888 18889 > s.log 2>&1 &
          echo $! > srv.pid
          sleep 0.5
          ./tcp-stress -c -servers "127.0.0.1:18888,127.0.0.1:18889" \
                    -target 100 -rate 100 > c.log 2>&1 &
          echo $! > cli.pid
          sleep 135
          kill -INT "$(cat cli.pid)"
          sleep 3
          echo '--- client log tail ---'; tail -5 c.log
          max_try=$(grep -oE 'try=[0-9]+' c.log | cut -d= -f2 | sort -n | tail -1)
          max_alive=$(grep -oE 'alive=[0-9]+' c.log | cut -d= -f2 | sort -n | tail -1)
          closed=$(grep -oE 'closed=[0-9]+' c.log | cut -d= -f2 | sort -n | tail -1)
          [ "$max_try" = "100" ]  || { echo "FAIL: try=$max_try != 100 (健康连接被误杀重拨)"; exit 1; }
          [ "$max_alive" = "100" ] || { echo "FAIL: alive=$max_alive != 100"; exit 1; }
          [ "$closed" = "0" ]     || { echo "FAIL: closed=$closed != 0"; exit 1; }
          grep -q 'final: try=100 ok=100 closed=0' c.log || { echo "FAIL: final 行异常"; exit 1; }
          kill -INT "$(cat srv.pid)"; sleep 1

      - name: 服务端回收测试(kill -9 客户端)
        run: |
          ./tcp-stress -s 18888 18889 > s2.log 2>&1 &
          echo $! > srv2.pid
          sleep 0.5
          ./tcp-stress -c -servers "127.0.0.1:18888,127.0.0.1:18889" \
                    -target 50 -rate 50 > c2.log 2>&1 &
          CLI2=$!
          sleep 4
          kill -9 $CLI2
          sleep 3
          tail -3 s2.log
          grep -q 'alive=0 |' s2.log      || { echo "FAIL: 服务端未感知断连"; exit 1; }
          grep -q 'total_close=50' s2.log || { echo "FAIL: total_close != 50"; exit 1; }
          kill -INT "$(cat srv2.pid)"

      - name: SIGHUP 优雅退出测试
        run: |
          ./tcp-stress -s 18888 > s3.log 2>&1 &
          SRV=$!
          sleep 0.5
          ./tcp-stress -c -servers 127.0.0.1:18888 -target 20 -rate 20 > c3.log 2>&1 &
          CLI=$!
          sleep 3
          kill -HUP $CLI
          sleep 2
          grep -q 'final: try=20 ok=20' c3.log || { echo "FAIL: SIGHUP 未优雅退出"; exit 1; }
          kill -HUP $SRV
          sleep 1
          grep -q 'bye. final alive' s3.log || { echo "FAIL: server SIGHUP 未优雅退出"; exit 1; }

      - name: 纯 Go 服务端双模式测试(CGO_ENABLED=0 构建)
        run: |
          CGO_ENABLED=0 go build -o tcp-stress-go .
          ./tcp-stress-go -s 18888 18889 > sg.log 2>&1 &
          SRV=$!
          sleep 0.5
          ./tcp-stress-go -c -servers "127.0.0.1:18888,127.0.0.1:18889" \
            -target 100 -rate 100 > cg.log 2>&1 &
          CLI=$!
          sleep 4
          grep -q 'alive=100 |' sg.log || { echo "FAIL: Go 服务端计数异常"; exit 1; }
          kill -9 $CLI
          sleep 3
          grep -q 'total_close=100' sg.log || { echo "FAIL: Go 服务端未回收断连"; exit 1; }
          kill -INT $SRV
          grep -q 'bye. final alive' sg.log || { echo "FAIL: Go 服务端退出异常"; exit 1; }
          echo 'GO SERVER PASS'

      - name: 鉴权矩阵测试
        run: |
          # A1 正确密码全流程
          ./tcp-stress -s -pass s3cret 18888 18889 > sa.log 2>&1 &
          SRV=$!
          sleep 0.5
          ./tcp-stress -c -servers "127.0.0.1:18888,127.0.0.1:18889" -pass s3cret \
            -target 50 -rate 50 > ca1.log 2>&1 &
          CLI=$!
          sleep 4
          kill -INT $CLI; sleep 2; kill -INT $SRV; sleep 0.5
          grep -q 'auth: enabled' sa.log || { echo 'FAIL: 服务端未启用鉴权'; exit 1; }
          grep -q 'final: try=50 ok=50' ca1.log || { echo 'FAIL: 鉴权连接未成功'; exit 1; }
          grep -q 'auth_fail=0' sa.log || { echo 'FAIL: auth_fail 应为 0'; exit 1; }
          # A2 错误密码:10 连败中止
          ./tcp-stress -s -pass s3cret 18888 > sa2.log 2>&1 &
          SRV=$!
          sleep 0.5
          ./tcp-stress -c -servers 127.0.0.1:18888 -pass wrongpw -target 20 -rate 20 \
            > ca2.log 2>&1 && { echo 'FAIL: 错密码应非零退出'; exit 1; } || true
          grep -q '鉴权连续失败 10 次' ca2.log || { echo 'FAIL: 未报连败中止'; exit 1; }
          sleep 1; grep -q 'auth_fail=[1-9]' sa2.log || { echo 'FAIL: 服务端未计 auth_fail'; exit 1; }
          kill -INT $SRV; sleep 0.5
          # A3 无密码客户端被 banner 检出
          ./tcp-stress -s -pass s3cret 18888 > sa3.log 2>&1 &
          SRV=$!
          sleep 0.5
          ./tcp-stress -c -servers 127.0.0.1:18888 -target 5 -rate 5 \
            > ca3.log 2>&1 && { echo 'FAIL: 无密码应非零退出'; exit 1; } || true
          grep -q '服务器要求鉴权' ca3.log || { echo 'FAIL: banner 未检出'; exit 1; }
          kill -INT $SRV; sleep 0.5
          # A4 服务端无密码 + 客户端带密码:忽略并正常跑
          ./tcp-stress -s 18888 > sa4.log 2>&1 &
          SRV=$!
          sleep 0.5
          ./tcp-stress -c -servers 127.0.0.1:18888 -pass x -target 20 -rate 20 > ca4.log 2>&1 &
          CLI=$!
          sleep 4
          kill -INT $CLI; sleep 2; kill -INT $SRV
          grep -q 'pass 已忽略' ca4.log || { echo 'FAIL: 未提示忽略'; exit 1; }
          grep -q 'final: try=20 ok=20' ca4.log || { echo 'FAIL: 忽略密码后未正常连接'; exit 1; }
          echo 'AUTH MATRIX PASS'

      - name: TUI 冒烟(向导可进可退,非终端不误入)
        run: |
          # pty 里 q 正常退出(向导 banner 出现)
          printf 'q\n' | script -qec "./tcp-stress" /dev/null > tui1.log 2>&1
          grep -q '压测向导' tui1.log || { echo 'FAIL: TUI 未进入'; exit 1; }
          # 管道/重定向:usage exit 2,不挂住
          # 注意 bash -e:命令预期非零,必须用 || 捕获,不能裸跑
          rc=0
          ./tcp-stress < /dev/null > tui2.log 2>&1 || rc=$?
          [ "$rc" -eq 2 ] || { echo "FAIL: 非终端裸调用应 exit 2,实际 $rc"; exit 1; }
          echo 'TUI SMOKE PASS'

      - name: armv7l 交叉构建检查
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -o tcp-stress-armv7l .
          readelf -h tcp-stress-armv7l | grep -q 'Machine:.*ARM' || { echo 'FAIL: not ARM'; exit 1; }
          readelf -h tcp-stress-armv7l | grep -q 'Class:.*ELF32' || { echo 'FAIL: not ELF32'; exit 1; }
          echo 'ARMV7L BUILD PASS'

      - name: fd 软上限自动抬升测试
        run: |
          ./tcp-stress -s 18888 > s4.log 2>&1 &
          SRV=$!
          sleep 0.5
          # soft 压到 256,target 300 > 256:不自动抬必 EMFILE
          bash -c 'ulimit -S -n 256; exec ./tcp-stress -c -servers 127.0.0.1:18888 -target 300 -rate 100' > c4.log 2>&1 &
          CLI=$!
          sleep 6
          grep -q 'fd limit:' c4.log || { echo "FAIL: 未打印 fd limit"; exit 1; }
          kill -INT $CLI
          sleep 2
          grep -q 'final: try=300 ok=300' c4.log || { echo "FAIL: soft=256 下 300 连接未全部成功(自动抬升未生效)"; exit 1; }
          kill -INT $SRV
          echo 'SMOKE PASS'

  release:
    needs: [build, smoke]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 生成 SHA256SUMS
        run: |
          cd dist
          ls -lh
          sha256sum tcp-conn-stress-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
